[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testquality"
version = "0.1.0"
description = "Automated quality assessment of LLM generated unit tests (Home Assistant threshold case study)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9"]

[project.scripts]
testquality = "testquality.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/testquality"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
